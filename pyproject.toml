[project]
name = "anonimizator3000"
version = "0.1.0"
description = "Public document anonymization portal using FastAPI, HTMX, Basecoat, and shared platform auth."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Anonimizator3000 contributors" },
]
dependencies = [
    "app-factory[platform]",
    "doctotext",
    "en-core-web-lg",
    "fala-runtime",
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.0",
    "my-auth[fastapi-htmx]",
    "my-usermanager[fastapi-htmx,myauth]",
    "pdf2docx>=0.5.8",
    "posejdon",
    "presidio-analyzer>=2.2.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pypdf>=5.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "ruff>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pip>=25.0",
    "posejdon[detectors]",
    "pypdf>=5.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "ruff>=0.9.0",
]
detectors = [
    "posejdon[detectors]",
]

[tool.uv.sources]
# Platform BOM from app-factory v0.6.5 COMPAT.md:
# app-factory v0.6.5 + my-auth v0.4.2 + my-usermanager v0.5.4
app-factory = { git = "https://github.com/mikolaj92/app-factory", tag = "v0.6.5" }
my-auth = { git = "https://github.com/mikolaj92/my-auth", tag = "v0.4.2" }
my-usermanager = { git = "https://github.com/mikolaj92/my-usermanager", tag = "v0.5.4" }
# `fala-runtime` is the legacy CPython carrier runtime used by this product
# (`fala.models`, `fala.carrier_runtime`, `fala.runtime_backend`). Do not replace
# it with Fala v0.7.x: that release only provides the incompatible host/sdk
# binding and intentionally removed `RuntimeBackendService`.
doctotext = { git = "https://github.com/mikolaj92/DocToText.git", rev = "33aaf6071f45cae8f33ad97fe4b40ffd0f1fd18a" }
fala-runtime = { git = "https://github.com/mikolaj92/Fala.git", rev = "6dd634d18b4812faed04897426bc69322ef59c34" }
posejdon = { git = "https://github.com/mikolaj92/Posejdon.git", tag = "v0.1.0" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.uv]
# Nested adapter uv.sources pin older app-factory tags
# (UM v0.5.4 sources app-factory@v0.6.4; my-auth v0.4.2 sources
# app-factory@v0.6.3). Override app-factory only. Do not override
# my-auth — UM v0.5.4 already nests my-auth@v0.4.2.
override-dependencies = [
  "app-factory[platform]",
]

[project.scripts]
anonimizator3000 = "anonimizator3000.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_anonymizer: test requiring the production detector stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
